<!--
  Grundjaktens märke, samma som components/GrundjaktenLogo.tsx: ett A som
  står på en grund av tre block.

  Bokstaven är ritad som en path, inte som <text>. En favicon renderas
  isolerat från sidan, så Google-fonten finns inte att tillgå där – den
  gamla ikonen bad om "Outfit" och fick ett systemtypsnitt i stället, och
  såg därför olika ut i varje webbläsare.

  Strecken är grövre än i appens märke (5 mot 4.2) och blocken högre
  (6 mot 5). Ikonen ska läsas i en flik på 16 px, inte i en logotypmanual.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <rect width="48" height="48" rx="11" fill="#6d28d9"/>
  <path d="M24 9 L33.5 31 M24 9 L14.5 31 M18.2 24.5 H29.8"
        fill="none" stroke="#ffffff" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="10" y="35" width="8.6" height="6" rx="2" fill="#a3e635"/>
  <rect x="19.7" y="35" width="8.6" height="6" rx="2" fill="#84cc16"/>
  <!-- Tredje blocket = steget som inte är taget än. Dämpat med en egen
       mörkare grön, inte med opacity: lime på 55 % över lila blandar sig
       till grått (#8b917f) och tappar att det är ett block i en rad. -->
  <rect x="29.4" y="35" width="8.6" height="6" rx="2" fill="#4d7c0f"/>
</svg>
